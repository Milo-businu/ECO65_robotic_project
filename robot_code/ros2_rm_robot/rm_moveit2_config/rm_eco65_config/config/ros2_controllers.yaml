# This config file is loaded by gazebo_ros2_control in Gazebo 11.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    rm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: effort_controllers/JointGroupEffortController

rm_group_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position

gripper_controller:
  ros__parameters:
    joints:
      - finger_left_joint
      - finger_right_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - effort
